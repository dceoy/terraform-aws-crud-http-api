---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /src/
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - '*'
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    groups:
      uv-dependencies:
        patterns:
          - '*'
  - package-ecosystem: terraform
    directories:
      - /modules/kms/
      - /modules/docker/
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      terraform-dependencies:
        patterns:
          - '*'
