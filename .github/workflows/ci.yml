---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint-and-scan
          - upgrade
        description: Choose the workflow to run
        default: lint-and-scan
jobs:
  terraform-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-scan')
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/terraform-lint-and-scan.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      use-trivy: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      search-path: .
      terraform-version: latest
      terragrunt-version: latest
  terraform-dependency-scan:
    if: >
      (github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-scan'))
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/trivy-scan.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      scan-type: filesystem
      scan-ref: .
      submit-dependencies: true
      snapshot-correlator: terraform-source
      trivy-scanners: vuln,secret,misconfig
      trivy-severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed: true
      trivy-exit-code: 1
      trivy-timeout: 5m0s
      report-format: sarif
      runs-on: ubuntu-slim
  terraform-lock-files-upgrade:
    if: github.event_name == 'workflow_dispatch' && inputs.workflow == 'upgrade'
    permissions:
      contents: write
      pull-requests: write
    uses: dceoy/gha-for-devops/.github/workflows/terraform-lock-files-upgrade.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      terragrunt-working-directories: envs/dev
      terraform-working-directories: modules
      terraform-version: latest
      terragrunt-version: latest
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  python-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-test')
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/python-package-lint-and-scan.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      package-path: .
      python-version: 3.x
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]'
    needs:
      - terraform-lint-and-scan
      - python-lint-and-scan
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      unconditional: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
