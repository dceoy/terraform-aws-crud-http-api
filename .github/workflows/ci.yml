---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint-and-scan
          - upgrade
        description: Choose the workflow to run
        default: lint-and-scan
jobs:
  terraform-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-scan')
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/terraform-lint-and-scan.yml@main
    with:
      use-trivy: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      search-path: .
      terraform-version: latest
      terragrunt-version: latest
  terraform-dependency-scan:
    if: >
      (github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-scan'))
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/trivy-scan.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      scan-type: filesystem
      scan-ref: .
      submit-dependencies: true
      snapshot-correlator: terraform-source
      trivy-scanners: vuln,secret,misconfig
      trivy-severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed: true
      trivy-exit-code: 1
      trivy-timeout: 5m0s
      report-format: sarif
      runs-on: ubuntu-slim
  terraform-lock-files-upgrade:
    if: github.event_name == 'workflow_dispatch' && inputs.workflow == 'upgrade'
    permissions:
      contents: write
      pull-requests: write
    uses: dceoy/gha-for-devops/.github/workflows/terraform-lock-files-upgrade.yml@main
    with:
      terragrunt-working-directories: envs/dev
      terraform-working-directories: modules
      terraform-version: latest
      terragrunt-version: latest
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  python-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-test')
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/python-package-lint-and-scan.yml@main
    with:
      package-path: .
      python-version: 3.x
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]'
    needs:
      - terraform-lint-and-scan
      - python-lint-and-scan
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main
    with:
      unconditional: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  temporary-module-lock-refresh:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'refactor/remove-terraform-lock-legacy-inputs'
      && github.event.pull_request.user.login == 'dceoy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup latest Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: latest
      - name: Regenerate incompatible Terraform provider locks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' lockfile; do
            working_dir="$(dirname "${lockfile}")"
            if compgen -G "${working_dir}/*.tf" > /dev/null; then
              terraform -chdir="${working_dir}" init -backend=false -upgrade -reconfigure
              rm -rf "${working_dir}/.terraform"
            fi
          done < <(find modules -mindepth 2 -maxdepth 2 -name .terraform.lock.hcl -print0)
          git add -u -- modules
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: refresh Terraform provider lockfiles for current constraints'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
