[project]
name = "dynamodb-handler"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "aws-lambda-powertools[tracer]>=3.41.0,<4.0.0",
  "boto3>=1.44.3,<2.0.0",
]

[dependency-groups]
dev = [
  "semgrep>=1.186.0",
  "ruff>=0.17.5,<0.18.0",
  "pyright>=1.1.379,<1.2.0",
  "types-aws-xray-sdk>=2.16.0.20261104,<2.17.0",
  "types-jmespath>=1.1.0.20260724,<1.2.0",
  "types-requests>=2.33.0.20261030,<2.34.0",
  "boto3-stubs>=1.44.3,<2.0.0",
]

[tool.uv]
exclude-newer = "1 day"
package = false
exclude-newer-package = { mcp = false, opentelemetry-api = false, opentelemetry-sdk = false, opentelemetry-exporter-otlp-proto-http = false, opentelemetry-instrumentation = false, opentelemetry-instrumentation-requests = false, opentelemetry-instrumentation-threading = false, opentelemetry-semantic-conventions = false, wcmatch = false }
override-dependencies = [
  "mcp==1.30.0",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-instrumentation==0.66b2",
  "opentelemetry-instrumentation-requests==0.66b2",
  "opentelemetry-instrumentation-threading==0.66b2",
  "opentelemetry-semantic-conventions==0.66b2",
  "wcmatch==11.2",
]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",  # flake8-annotations (ANN)
  "FBT",  # flake8-boolean-trap (FBT)
  # Keep copyright-header enforcement opt-in.
  "CPY",
  "EXE",  # flake8-executable (EXE)
  "FA",  # flake8-future-annotations (FA)
  "RET",  # flake8-return (RET)
  "function-call-in-default-argument",
  "builtin-argument-shadowing",
  "builtin-import-shadowing",
  "missing-trailing-comma",
  "single-line-implicit-string-concatenation",
  "unnecessary-placeholder",
  "raise-vanilla-args",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
typeCheckingMode = "strict"
exclude = ["build", ".venv"]
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"
