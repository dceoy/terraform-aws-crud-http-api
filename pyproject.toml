[project]
name = "dynamodb-handler"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "aws-lambda-powertools[tracer]>=3.37.0,<4.0.0",
  "boto3>=1.43.119,<2.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.17.2,<0.18.0",
  "pyright>=1.1.379,<1.2.0",
  "types-aws-xray-sdk>=2.14.0.20240606,<2.16.0",
  "types-jmespath>=1.1.0.20260724,<1.2.0",
  "types-requests>=2.33.0.20261006,<2.34.0",
  "boto3-stubs>=1.43.119,<2.0.0",
]

[tool.uv]
exclude-newer = "1 day"
package = false

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",  # flake8-annotations (ANN)
  "FBT",  # flake8-boolean-trap (FBT)
  # Keep copyright-header enforcement opt-in.
  "CPY",
  "EXE",  # flake8-executable (EXE)
  "FA",  # flake8-future-annotations (FA)
  "RET",  # flake8-return (RET)
  "function-call-in-default-argument",
  "builtin-argument-shadowing",
  "builtin-import-shadowing",
  "missing-trailing-comma",
  "single-line-implicit-string-concatenation",
  "unnecessary-placeholder",
  "raise-vanilla-args",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
typeCheckingMode = "strict"
exclude = ["build", ".venv"]
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
